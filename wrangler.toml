name = "autonomous-ai-team"
main = "worker/index.ts"
compatibility_date = "2026-11-12"
workers_dev = true
preview_urls = false

[vars]
AI_GATEWAY_ID = "ai-team-gateway"
CLOUDFLARE_ACCOUNT_ID = ""
ALLOWED_REPOSITORY = ""
GITHUB_APP_INSTALLATION_ID = ""
DASHBOARD_ORIGIN = "http://localhost:5173"
FREE_PROVIDERS_VERIFIED = "false"

[[d1_databases]]
binding = "DB"
database_name = "ai_engine_d1"
database_id = "00000000-0000-0000-0000-000000000000"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "ai-fix-queue"

[[queues.consumers]]
queue = "ai-fix-queue"
max_batch_size = 4
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "ai-fix-dead-letter"

[[workflows]]
binding = "FIX"
name = "ai-team-fix"
class_name = "FixWorkflow"

[[workflows]]
binding = "IMPROVE"
name = "ai-team-improve"
class_name = "ImproveWorkflow"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[durable_objects.bindings]]
name = "COMPUTE"
class_name = "Compute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget", "Compute"]

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true
