name = "autonomous-ai-team"
main = "worker/index.ts"
compatibility_date = "2026-11-12"
workers_dev = true
preview_urls = false

[vars]
AI_GATEWAY_ID = "ai-team-gateway"
CLOUDFLARE_ACCOUNT_ID = "d957671c2d5716f3c3c782eb0d1f7e47"
ALLOWED_REPOSITORY = "jouhatsu0one/autonomous-ai-team"
GITHUB_APP_INSTALLATION_ID = ""
DASHBOARD_ORIGIN = "https://autonomous-ai-team.pages.dev"
FREE_PROVIDERS_VERIFIED = "false"

[[d1_databases]]
binding = "DB"
database_name = "autonomous-ai-team-db"
database_id = "37df4188-f058-4dfa-9862-3fd8cd80f1ca"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "autonomous-ai-team-tasks"

[[queues.consumers]]
queue = "autonomous-ai-team-tasks"
max_batch_size = 4
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "autonomous-ai-team-dead-letter"

[[workflows]]
binding = "FIX"
name = "ai-team-fix"
class_name = "FixWorkflow"

[[workflows]]
binding = "IMPROVE"
name = "ai-team-improve"
class_name = "ImproveWorkflow"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[durable_objects.bindings]]
name = "COMPUTE"
class_name = "Compute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget", "Compute"]

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true
